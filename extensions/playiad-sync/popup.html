<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mandat OS — Playiad Sync</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      background-color: #f8fafc;
      color: #0f172a;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: 800;
      color: #00A0E2;
    }
    p {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #475569;
      display: block;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      background-color: #00A0E2;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0088c2;
    }
    .status {
      margin-top: 12px;
      font-size: 11px;
      text-align: center;
      color: #16a34a;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h3>Mandat OS x Playiad</h3>
  <p>Synchronisez en 1 clic vos leads acquéreurs depuis l'intranet iad vers Mandat OS.</p>

  <label for="mandatUrl">URL du serveur Mandat OS</label>
  <input type="text" id="mandatUrl" value="https://app.alexandrelopez.fr">

  <button id="saveBtn">Enregistrer la configuration</button>
  <div id="status" class="status"></div>

  <script src="popup.js"></script>
</body>
</html>
